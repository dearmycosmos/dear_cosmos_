    function initJoystick() {
      const isTouch = (`ontouchstart` in window) || navigator.maxTouchPoints > 0 || window.innerWidth <= 1024;
      if (isTouch) {
        appState.joystickVisible = true;
        const cluster = document.getElementById(`joystick-cluster`);
        const btn = document.getElementById(`btn-joystick-toggle`);
        if (cluster) cluster.classList.add(`visible`);
        if (btn) btn.classList.add(`is-active`);
      }

      const base = document.getElementById(`joystick-base`);
      const knob = document.getElementById(`joystick-knob`);
      if (!base || !knob) return;

      let activeTouchId = null;

      function updateKnob(clientX, clientY) {
        const rect = base.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const maxR = rect.width * 0.34;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const dist = Math.hypot(dx, dy);
        if (dist > maxR) {
          dx = (dx / dist) * maxR;
          dy = (dy / dist) * maxR;
        }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        appState.joystickAxisX = Math.abs(dx) > 4 ? (dx / maxR) : 0;
        if (dy < -maxR * 0.72) {
          triggerPlayerJump();
        }
      }

      function resetKnob() {
        activeTouchId = null;
        appState.joystickAxisX = 0;
        knob.style.transform = `translate(0px, 0px)`;
      }

      base.addEventListener(`pointerdown`, function (e) {
        ensureAudioContext();
        activeTouchId = e.pointerId;
        base.setPointerCapture(e.pointerId);
        updateKnob(e.clientX, e.clientY);
      });

      base.addEventListener(`pointermove`, function (e) {
        if (activeTouchId !== e.pointerId) return;
        updateKnob(e.clientX, e.clientY);
      });

      base.addEventListener(`pointerup`, function (e) {
        if (activeTouchId === e.pointerId) resetKnob();
      });

      base.addEventListener(`pointercancel`, function () {
        resetKnob();
      });
    }

    /* =========================================================================
       15. Canvas Interaction & Keyboard Controls
       ========================================================================= */
    const keysDown = {};

    window.addEventListener(`keydown`, function (e) {
      if (e.target && (e.target.tagName === `INPUT` || e.target.tagName === `TEXTAREA`)) return;
      keysDown[e.code] = true;
      if (e.code === `Space`) {
        e.preventDefault();
        ensureAudioContext();
        triggerPlayerJump();
      }
    });

    window.addEventListener(`keyup`, function (e) {
      keysDown[e.code] = false;
    });

    function triggerPlayerJump() {
      if (!appState.player.isJumping) {
        appState.player.isJumping = true;
        appState.player.vy = -410;
        if (appState.player.inLake) {
          appState.ripples.push({ x: appState.player.xNorm * viewW, y: getWaterLevelY() + 6, r: 6, maxR: 48, alpha: 0.75 });
          playWaterFootstep(1.2);
        }
      }
    }

    function handleCanvasClick(clientX, clientY) {
      ensureAudioContext();

      // Close audio popover if open
      const pop = document.getElementById(`audio-popover`);
      if (pop && pop.classList.contains(`open`)) {
        pop.classList.remove(`open`);
      }

      // 1. Hit-test Orbit Stars in sky
      const hitNow = performance.now();
      for (let b = 0; b < appState.orbitBatches.length; b++) {
        const batch = appState.orbitBatches[b];
        for (let c = 0; c < batch.curves.length; c++) {
          const curve = batch.curves[c];
          const star = curve.star;
          if (!star || star.state !== `ready`) continue;
          const drawProgress = Math.min(1, Math.max(0, hitNow - curve.createdAt - curve.delayMs) / 3000);
          if (drawProgress < 0.45) continue;
          const pt = evalOrbitPoint(curve, Math.min(drawProgress, star.t));
          if (Math.hypot(clientX - pt.x, clientY - pt.y) <= 24) {
            openWriteModalForStar(star);
            return;
          }
        }
      }

      // 2. Hit-test Other Players (1:1 Chat Request)
      const peers = getActiveRoomMembers(appState.currentPlanet);
      for (let i = 0; i < peers.length; i++) {
        const peer = peers[i];
        const px = peer.xNorm * viewW;
        const py = getWalkableSurfaceY(px) - 24;
        if (Math.hypot(clientX - px, clientY - py) <= 28) {
          openChatRequestForPeer(peer);
          return;
        }
      }

      // 3. Hit-test Fallen Stars (player walks over first!)
      for (let i = 0; i < appState.fallenStars.length; i++) {
        const fs = appState.fallenStars[i];
        const fx = fs.xNorm * viewW;
        const fy = fs.landOnLake ? getWaterLevelY() + 2 : getHillSurfaceY(fx) - 6;
        if (Math.hypot(clientX - fx, clientY - fy) <= 28) {
          appState.pendingInspect = fs;
          appState.player.targetXNorm = fs.xNorm;
          return;
        }
      }

      // 4. Hit-test Paper Boats on Lake (player walks over first!)
      for (let i = 0; i < appState.paperBoats.length; i++) {
        const boat = appState.paperBoats[i];
        const bx = boat.xNorm * viewW;
        const by = getWaterLevelY() + 5;
        if (Math.hypot(clientX - bx, clientY - by) <= 30) {
          appState.pendingInspect = Object.assign({ isBoat: true }, boat);
          appState.pendingInspectRef = boat;
          appState.player.targetXNorm = boat.xNorm;
          return;
        }
      }

      // 5. Check if clicked empty sky vs terrain/lake
      const groundAtX = getHillSurfaceY(clientX);
      const waterY = getWaterLevelY();
      const boundaryY = Math.min(groundAtX, waterY) - 24;

      if (clientY < boundaryY) {
        spawnOrbitsAtSky(clientX, clientY);
      } else {
        appState.pendingInspect = null;
        appState.player.targetXNorm = Math.max(0.04, Math.min(0.95, clientX / Math.max(1, viewW)));
      }
    }

    if (canvas) {
      canvas.addEventListener(`click`, function (e) {
        handleCanvasClick(e.clientX, e.clientY);
      });
    }

    /* =========================================================================
       16. Character, Accessories, Boats & World Rendering
       ========================================================================= */
    function drawCloakedTraveler(cCtx, x, y, options) {
      const isMine = options.isMine;
      const isAdmin = options.isAdmin;
      const accessory = options.accessory || `none`;
      const wetRatio = options.wetRatio || 0;
      const facing = options.facing || 1;
      const walkPhase = options.walkPhase || 0;
      const label = options.name || ``;
      const bob = Math.abs(Math.sin(walkPhase)) * 2.2;

      cCtx.save();
      cCtx.translate(x, y - bob);

      // Soft ground shadow
      cCtx.fillStyle = `rgba(4, 8, 16, 0.38)`;
      cCtx.beginPath();
      cCtx.ellipse(0, bob + 2, 13, 4, 0, 0, Math.PI * 2);
      cCtx.fill();

      // Cloak body path
      const cloakPath = new Path2D();
      cloakPath.moveTo(0, -44);
      cloakPath.bezierCurveTo(10, -44, 13, -32, 15, -10);
      cloakPath.quadraticCurveTo(16, 0, 12, 2);
      cloakPath.lineTo(-12, 2);
      cloakPath.quadraticCurveTo(-16, 0, -15, -10);
      cloakPath.bezierCurveTo(-13, -32, -10, -44, 0, -44);
      cloakPath.closePath();

      // White outline glow ONLY for my character
      if (isMine) {
        cCtx.save();
        cCtx.shadowColor = `rgba(255, 255, 255, 0.92)`;
        cCtx.shadowBlur = 11;
        cCtx.strokeStyle = `rgba(255, 255, 255, 0.95)`;
        cCtx.lineWidth = 2.4;
        cCtx.stroke(cloakPath);
        cCtx.restore();
      }

      // Cloak Fill (Admin wears Red Cloak; normal player dark midnight cloak; others pure black silhouette)
      if (isMine && isAdmin) {
        const redGrad = cCtx.createLinearGradient(0, -44, 0, 2);
        redGrad.addColorStop(0, `#d93b52`);
        redGrad.addColorStop(1, `#8c1c2e`);
        cCtx.fillStyle = redGrad;
      } else if (isMine) {
        const myGrad = cCtx.createLinearGradient(0, -44, 0, 2);
        myGrad.addColorStop(0, `#1b2945`);
        myGrad.addColorStop(1, `#0d1526`);
        cCtx.fillStyle = myGrad;
      } else {
        cCtx.fillStyle = `#070a12`;
      }
      cCtx.fill(cloakPath);

      // Wet hem overlay (after standing in lake up to 10s)
      if (wetRatio > 0.02) {
        cCtx.save();
        cCtx.clip(cloakPath);
        const wetH = 16 * wetRatio;
        const wGrad = cCtx.createLinearGradient(0, 2 - wetH, 0, 3);
        wGrad.addColorStop(0, `rgba(18, 48, 86, 0)`);
        wGrad.addColorStop(0.5, `rgba(24, 68, 114, ${0.55 * wetRatio})`);
        wGrad.addColorStop(1, `rgba(92, 165, 215, ${0.42 * wetRatio})`);
        cCtx.fillStyle = wGrad;
        cCtx.fillRect(-18, 2 - wetH, 36, wetH + 2);
        cCtx.restore();
      }

      // Subtle glowing eyes
      cCtx.fillStyle = isMine ? `#f2ece1` : `rgba(223, 170, 91, 0.65)`;
      cCtx.beginPath();
      cCtx.arc(facing * 3.5 - 2.2, -31, 1.3, 0, Math.PI * 2);
      cCtx.arc(facing * 3.5 + 2.2, -31, 1.3, 0, Math.PI * 2);
      cCtx.fill();

      // Accessories for other real players
      if (!isMine) {
        if (accessory === `blue_scarf`) {
          cCtx.fillStyle = `#4da6ff`;
          cCtx.beginPath();
          cCtx.roundRect(-10, -25, 20, 5, 2);
          cCtx.fill();
          cCtx.beginPath();
          cCtx.moveTo(-facing * 5, -22);
          cCtx.lineTo(-facing * 14, -10);
          cCtx.lineTo(-facing * 9, -8);
          cCtx.lineTo(-facing * 2, -20);
          cCtx.fill();
        } else if (accessory === `green_hat`) {
          cCtx.fillStyle = `#48b878`;
          cCtx.beginPath();
          cCtx.ellipse(0, -41, 14, 3.5, 0, 0, Math.PI * 2);
          cCtx.fill();
          cCtx.beginPath();
          cCtx.moveTo(-8, -41);
          cCtx.lineTo(0, -56);
          cCtx.lineTo(8, -41);
          cCtx.closePath();
          cCtx.fill();
        } else if (accessory === `pink_ribbon`) {
          cCtx.fillStyle = `#f48fb1`;
          cCtx.beginPath();
          cCtx.moveTo(0, -24);
          cCtx.lineTo(-8, -29);
          cCtx.lineTo(-8, -19);
          cCtx.closePath();
          cCtx.moveTo(0, -24);
          cCtx.lineTo(8, -29);
          cCtx.lineTo(8, -19);
          cCtx.closePath();
          cCtx.fill();
          cCtx.beginPath();
          cCtx.arc(0, -24, 2.5, 0, Math.PI * 2);
          cCtx.fill();
        } else if (accessory === `yellow_tie`) {
          cCtx.fillStyle = `#f7d046`;
          cCtx.beginPath();
          cCtx.moveTo(0, -24);
          cCtx.lineTo(3, -15);
          cCtx.lineTo(0, -10);
          cCtx.lineTo(-3, -15);
          cCtx.closePath();
          cCtx.fill();
        } else if (accessory === `blue_glasses`) {
          cCtx.strokeStyle = `#66c8ff`;
          cCtx.lineWidth = 1.6;
          cCtx.beginPath();
          cCtx.arc(facing * 3.5 - 2.6, -31, 3, 0, Math.PI * 2);
          cCtx.stroke();
          cCtx.beginPath();
          cCtx.arc(facing * 3.5 + 2.6, -31, 3, 0, Math.PI * 2);
          cCtx.stroke();
        }
      }

      // Name tag above my character (and subtle hover/tag for others)
      if (label) {
        cCtx.font = `500 12px "Noto Sans KR", sans-serif`;
        const tw = cCtx.measureText(label).width;
        const padX = 8;
        const tagY = accessory === `green_hat` ? -68 : -58;
        cCtx.fillStyle = isMine ? `rgba(14, 22, 38, 0.78)` : `rgba(10, 16, 29, 0.62)`;
        cCtx.strokeStyle = isMine ? `rgba(242, 236, 225, 0.55)` : `rgba(155, 168, 191, 0.25)`;
        cCtx.lineWidth = 1;
        cCtx.beginPath();
        cCtx.roundRect(-tw / 2 - padX, tagY - 11, tw + padX * 2, 20, 10);
        cCtx.fill();
        cCtx.stroke();

        cCtx.fillStyle = isMine ? `#f2ece1` : `#9ba8bf`;
        cCtx.textAlign = `center`;
        cCtx.textBaseline = `middle`;
        cCtx.fillText(label, 0, tagY - 1);
      }

      cCtx.restore();
    }

    function drawPaperBoat(cCtx, x, y, phase, isReflection) {
      cCtx.save();
      cCtx.translate(x, y + (isReflection ? 4 : Math.sin(phase) * 2.2));
      if (isReflection) {
        cCtx.scale(1, -0.65);
        cCtx.globalAlpha = 0.28;
      }

      cCtx.fillStyle = `#f4ead5`;
      cCtx.strokeStyle = `#d5c39f`;
      cCtx.lineWidth = 1;
      // Hull
      cCtx.beginPath();
      cCtx.moveTo(-16, 0);
      cCtx.lineTo(16, 0);
      cCtx.lineTo(10, 7);
      cCtx.lineTo(-10, 7);
      cCtx.closePath();
      cCtx.fill();
      cCtx.stroke();

      // Sail
      cCtx.fillStyle = `#fffaf0`;
      cCtx.beginPath();
      cCtx.moveTo(-7, 0);
      cCtx.lineTo(0, -14);
      cCtx.lineTo(7, 0);
      cCtx.closePath();
      cCtx.fill();
      cCtx.stroke();

      cCtx.restore();
    }

    /* =========================================================================
       17. Main Animation Loop
       ========================================================================= */
    let lastFrameTime = performance.now();
    let nextMeteorAt = performance.now() + 4500;
    let lastFootstepRippleAt = 0;

    function updateSimulation(dt, now) {
      // 1. Player horizontal movement (keyboard, joystick, or click-to-walk)
      const moveSpeedNorm = 0.145; // fraction of screen width per second
      let manualAxis = 0;
      if (keysDown[`ArrowLeft`] || keysDown[`KeyA`]) manualAxis -= 1;
      if (keysDown[`ArrowRight`] || keysDown[`KeyD`]) manualAxis += 1;
      if (Math.abs(appState.joystickAxisX) > 0.05) manualAxis = appState.joystickAxisX;

      const p = appState.player;
      let isMoving = false;
      if (Math.abs(manualAxis) > 0.01) {
        appState.pendingInspect = null;
        p.xNorm = Math.max(0.03, Math.min(0.96, p.xNorm + manualAxis * moveSpeedNorm * dt));
        p.targetXNorm = p.xNorm;
        p.facing = manualAxis >= 0 ? 1 : -1;
        isMoving = true;
      } else {
        const diff = p.targetXNorm - p.xNorm;
        if (Math.abs(diff) > 0.003) {
          const step = Math.sign(diff) * Math.min(Math.abs(diff), moveSpeedNorm * dt);
          p.xNorm += step;
          p.facing = diff >= 0 ? 1 : -1;
          isMoving = true;
        } else if (appState.pendingInspect) {
          const targetItem = appState.pendingInspectRef || appState.pendingInspect;
          const isBoat = Boolean(appState.pendingInspect.isBoat);
          appState.pendingInspect = null;
          appState.pendingInspectRef = null;
          openReadingModal(isBoat ? Object.assign({ isBoat: true }, targetItem) : targetItem);
        }
      }

      if (isMoving) {
        p.walkPhase += dt * 11;
      }

      // 2. Player jump physics
      if (p.isJumping) {
        p.yOffset += p.vy * dt;
        p.vy += 1180 * dt;
        if (p.yOffset >= 0) {
          p.yOffset = 0;
          p.vy = 0;
          p.isJumping = false;
          if (p.inLake) {
            appState.ripples.push({ x: p.xNorm * viewW, y: getWaterLevelY() + 7, r: 5, maxR: 42, alpha: 0.7 });
            playWaterFootstep(1.0);
          }
        }
      }

      // 3. Lake detection, wetness (10s wet / 5s dry) & water footsteps
      const px = p.xNorm * viewW;
      const shoreX = getShoreNorm() * viewW;
      p.inLake = px > shoreX + 8 && p.xNorm < 0.94;

      if (p.inLake && !p.isJumping) {
        p.wetSeconds = Math.min(10, p.wetSeconds + dt);
        if (isMoving && now - lastFootstepRippleAt > 280) {
          lastFootstepRippleAt = now;
          appState.ripples.push({ x: px, y: getWalkableSurfaceY(px) + 2, r: 4, maxR: 34, alpha: 0.65 });
          playWaterFootstep(0.85);
        }
      } else if (!p.inLake) {
        p.wetSeconds = Math.max(0, p.wetSeconds - dt * 2.0); // dries in 5s
      }
      p.wetRatio = p.wetSeconds / 10;

      // Occasional water droplet when wet on dry land
      if (p.wetRatio > 0.25 && Math.random() < dt * 2.4) {
        appState.waterDroplets.push({
          x: px + (Math.random() - 0.5) * 16,
          y: getWalkableSurfaceY(px) + p.yOffset - 4,
          vy: 30 + Math.random() * 30,
          alpha: 0.85
        });
      }

      // 4. Gentle NPC traveler strolling
      for (let i = 0; i < npcTravelers.length; i++) {
        const npc = npcTravelers[i];
        if (npc.planet !== appState.currentPlanet) continue;
        if (now >= npc.nextMoveAt) {
          npc.targetXNorm = 0.08 + Math.random() * 0.74;
          npc.nextMoveAt = now + 5000 + Math.random() * 7000;
        }
        const d = npc.targetXNorm - npc.xNorm;
        if (Math.abs(d) > 0.004) {
          npc.xNorm += Math.sign(d) * Math.min(Math.abs(d), 0.055 * dt);
          npc.facing = d >= 0 ? 1 : -1;
          npc.walkPhase += dt * 7;
        }
        npc.wetRatio = npc.xNorm > getShoreNorm() ? 0.5 : 0;
      }

      // 5. Background meteors
      if (now >= nextMeteorAt) {
        nextMeteorAt = now + 5500 + Math.random() * 6500;
        appState.meteors.push({
          x: (0.1 + Math.random() * 0.8) * viewW,
          y: (0.04 + Math.random() * 0.24) * viewH,
          vx: (Math.random() < 0.5 ? 1 : -1) * (240 + Math.random() * 140),
          vy: 110 + Math.random() * 80,
          alpha: 1
        });
      }

      // 6. Incoming falling star trajectories
      for (let i = appState.fallingTrails.length - 1; i >= 0; i--) {
        const tr = appState.fallingTrails[i];
        tr.progress += dt * 0.65;
        if (tr.progress >= 1) {
          appState.fallenStars.push({
            id: `fstar_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            xNorm: tr.targetXNorm,
            landOnLake: tr.landOnLake,
            payload: tr.payload,
            phase: Math.random() * Math.PI * 2
          });
          if (tr.landOnLake) {
            appState.ripples.push({
              x: tr.targetXNorm * viewW,
              y: getWaterLevelY() + 4,
              r: 6,
              maxR: 60,
              alpha: 0.9
            });
            playWaterFootstep(1.1);
          } else {
            playSparkleChime(740);
          }
          appState.fallingTrails.splice(i, 1);
        }
      }

      // 7. Paper boats gentle bobbing
      for (let i = 0; i < appState.paperBoats.length; i++) {
        const b = appState.paperBoats[i];
        b.phase += dt * 2.1;
        b.xNorm += b.driftDir * 0.0025 * dt;
        if (b.xNorm < 0.58 || b.xNorm > 0.90) b.driftDir *= -1;
      }

      // 8. Fireflies drift
      for (let i = 0; i < fireflies.length; i++) {
        const f = fireflies[i];
        f.xNorm += f.vx * (dt * 60);
        f.yOffset += f.vy * (dt * 60);
        if (f.xNorm < 0.03 || f.xNorm > 0.53) f.vx *= -1;
        if (f.yOffset < 6 || f.yOffset > 82) f.vy *= -1;
      }
    }

    function renderFrame(now) {
      const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
      lastFrameTime = now;
      updateSimulation(dt, now);

      if (!ctx) {
        requestAnimationFrame(renderFrame);
        return;
      }

      const sky = getCurrentSkyColors(now);
      const waterY = getWaterLevelY();
      const shoreX = getShoreNorm() * viewW;

      // 1. Sky Gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, waterY + 20);
      skyGrad.addColorStop(0, sky.top);
      skyGrad.addColorStop(0.55, sky.mid);
      skyGrad.addColorStop(1, sky.horizon);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, viewW, viewH);

      // 2. Shimmering Stars in Sky
      for (let i = 0; i < bgStars.length; i++) {
        const st = bgStars[i];
        const twinkle = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(now * 0.0018 * st.speed + st.phase));
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = st.tint;
        ctx.beginPath();
        ctx.arc(st.xNorm * viewW, st.yNorm * viewH, st.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // 3. Ambient Background Meteors
      for (let i = appState.meteors.length - 1; i >= 0; i--) {
        const m = appState.meteors[i];
        m.x += m.vx * dt;
        m.y += m.vy * dt;
        m.alpha -= dt * 0.9;
        if (m.alpha <= 0) {
          appState.meteors.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.strokeStyle = `rgba(242, 236, 225, ${m.alpha * 0.85})`;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - m.vx * 0.14, m.y - m.vy * 0.14);
        ctx.stroke();
        ctx.restore();
      }

      // 4. Active Orbits & Orbit Stars in Sky
      drawOrbitsAndStars(ctx, now, false);

      // 5. Departing Written Stars with Long Glowing Tail
      for (let i = appState.shootingEffects.length - 1; i >= 0; i--) {
        const sh = appState.shootingEffects[i];
        sh.x += sh.vx * dt;
        sh.y += sh.vy * dt;
        sh.trail.push({ x: sh.x, y: sh.y });
        if (sh.trail.length > 36) sh.trail.shift();
        sh.alpha -= dt * 0.48;

        if (sh.alpha <= 0) {
          appState.shootingEffects.splice(i, 1);
          continue;
        }

        ctx.save();
        for (let t = 1; t < sh.trail.length; t++) {
          const ratio = t / sh.trail.length;
          ctx.strokeStyle = `rgba(245, 220, 176, ${ratio * sh.alpha})`;
          ctx.lineWidth = ratio * 4.2;
          ctx.beginPath();
          ctx.moveTo(sh.trail[t - 1].x, sh.trail[t - 1].y);
          ctx.lineTo(sh.trail[t].x, sh.trail[t].y);
          ctx.stroke();
        }
        ctx.fillStyle = `rgba(255, 250, 240, ${sh.alpha})`;
        ctx.beginPath();
        ctx.arc(sh.x, sh.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 6. Incoming Falling Star Trails
      for (let i = 0; i < appState.fallingTrails.length; i++) {
        const tr = appState.fallingTrails[i];
        const tx = tr.targetXNorm * viewW;
        const ty = tr.landOnLake ? waterY + 2 : getHillSurfaceY(tx) - 6;
        const sx = tr.xNorm * viewW;
        const cx = sx + (tx - sx) * tr.progress;
        const cy = -20 + (ty + 20) * tr.progress;

        ctx.save();
        const grad = ctx.createLinearGradient(cx, cy, cx - (tx - sx) * 0.16, cy - (ty + 20) * 0.16);
        grad.addColorStop(0, `rgba(255, 248, 224, 0.98)`);
        grad.addColorStop(1, `rgba(223, 170, 91, 0)`);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx - (tx - sx) * 0.16, cy - (ty + 20) * 0.16);
        ctx.stroke();

        ctx.fillStyle = `#fffaf0`;
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 7. Curved Reflective Lake on the Right
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(shoreX - 30, waterY);
      ctx.bezierCurveTo(shoreX + viewW * 0.08, waterY - 8, viewW * 0.84, waterY - 6, viewW, waterY + 6);
      ctx.lineTo(viewW, viewH);
      ctx.lineTo(shoreX - 30, viewH);
      ctx.closePath();
      ctx.clip();

      // Water base reflection gradient
      const waterGrad = ctx.createLinearGradient(0, waterY, 0, viewH);
      waterGrad.addColorStop(0, sky.horizon);
      waterGrad.addColorStop(0.5, sky.mid);
      waterGrad.addColorStop(1, `#070c17`);
      ctx.fillStyle = waterGrad;
      ctx.fillRect(shoreX - 30, waterY - 10, viewW - shoreX + 40, viewH - waterY + 20);

      // Dark nocturnal water veil
      ctx.fillStyle = `rgba(6, 12, 24, 0.36)`;
      ctx.fillRect(shoreX - 30, waterY - 10, viewW - shoreX + 40, viewH - waterY + 20);

      // Reflected stars on lake surface
      for (let i = 0; i < bgStars.length; i++) {
        const st = bgStars[i];
        if (st.xNorm < 0.48) continue;
        const ry = waterY + (waterY - st.yNorm * viewH) * 0.55;
        if (ry < waterY || ry > viewH) continue;
        const shimmerX = st.xNorm * viewW + Math.sin(now * 0.004 + ry * 0.12) * 4;
        const twinkle = 0.2 + 0.35 * (0.5 + 0.5 * Math.sin(now * 0.002 * st.speed + st.phase));
        ctx.fillStyle = st.tint;
        ctx.globalAlpha = twinkle;
        ctx.fillRect(shimmerX - st.r, ry, st.r * 2.4, 1.3);
      }
      ctx.globalAlpha = 1;

      // Reflected Orbits on lake surface
      drawOrbitsAndStars(ctx, now, true);

      // Reflected Paper Boats
      for (let i = 0; i < appState.paperBoats.length; i++) {
        const boat = appState.paperBoats[i];
        drawPaperBoat(ctx, boat.xNorm * viewW, waterY + 5, boat.phase, true);
      }

      // Water surface shimmer lines
      ctx.strokeStyle = `rgba(242, 236, 225, 0.09)`;
      ctx.lineWidth = 1;
      for (let r = 0; r < 14; r++) {
        const ly = waterY + 12 + r * 14;
        const lx = shoreX + 20 + ((r * 73) % Math.max(40, viewW - shoreX - 40)) + Math.sin(now * 0.001 + r) * 14;
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.lineTo(lx + 26 + (r % 3) * 12, ly);
        ctx.stroke();
      }

      // Water Ripples
      for (let i = appState.ripples.length - 1; i >= 0; i--) {
        const rp = appState.ripples[i];
        rp.r += dt * 36;
        rp.alpha -= dt * 0.55;
        if (rp.alpha <= 0 || rp.r >= rp.maxR) {
          appState.ripples.splice(i, 1);
          continue;
        }
        ctx.strokeStyle = `rgba(190, 226, 248, ${rp.alpha * 0.65})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.28, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();

      // Subtle curved shoreline glow
      ctx.save();
      ctx.strokeStyle = `rgba(124, 196, 232, 0.22)`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(shoreX - 6, waterY);
      ctx.bezierCurveTo(shoreX + viewW * 0.08, waterY - 4, viewW * 0.84, waterY - 3, viewW, waterY + 6);
      ctx.stroke();
      ctx.restore();

      // 8. Background Distant Hill Silhouette
      ctx.save();
      ctx.fillStyle = `rgba(10, 16, 30, 0.72)`;
      ctx.beginPath();
      ctx.moveTo(0, viewH);
      for (let x = 0; x <= shoreX + 40; x += 16) {
        const y = getHillSurfaceY(x) - 18 - Math.sin(x * 0.008) * 10;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(shoreX + 40, viewH);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 9. Foreground Organic Hill (Left) + Far Right Curved Lake Bank
      ctx.save();
      const hillGrad = ctx.createLinearGradient(0, viewH * 0.5, 0, viewH);
      hillGrad.addColorStop(0, `#132328`);
      hillGrad.addColorStop(0.55, `#0b151c`);
      hillGrad.addColorStop(1, `#060b12`);
      ctx.fillStyle = hillGrad;
      ctx.beginPath();
      ctx.moveTo(0, viewH);
      for (let x = 0; x <= shoreX + 18; x += 8) {
        ctx.lineTo(x, getHillSurfaceY(x));
      }
      ctx.lineTo(shoreX + 26, viewH);
      ctx.closePath();
      ctx.fill();

      // Curved far-right reed bank rounding the lake
      ctx.beginPath();
      ctx.moveTo(viewW * 0.92, viewH);
      ctx.quadraticCurveTo(viewW * 0.95, waterY - 6, viewW, waterY - 12);
      ctx.lineTo(viewW, viewH);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 10. Swaying Grass Blades along Hill
      ctx.save();
      ctx.strokeStyle = `rgba(62, 114, 92, 0.72)`;
      ctx.lineWidth = 1.3;
      for (let i = 0; i < grassBlades.length; i++) {
        const g = grassBlades[i];
        const gx = g.xNorm * viewW;
        const gy = getHillSurfaceY(gx);
        const sway = Math.sin(now * 0.002 + g.phase) * 3.5;
        ctx.beginPath();
        ctx.moveTo(gx, gy + 2);
        ctx.quadraticCurveTo(gx + g.lean * 0.5, gy - g.len * 0.5, gx + g.lean + sway, gy - g.len);
        ctx.stroke();
      }
      ctx.restore();

      // 11. Floating Paper Boats on Lake
      for (let i = 0; i < appState.paperBoats.length; i++) {
        const boat = appState.paperBoats[i];
        drawPaperBoat(ctx, boat.xNorm * viewW, waterY + 5, boat.phase, false);
      }

      // 12. Fallen Stars on Hill & Lake
      for (let i = 0; i < appState.fallenStars.length; i++) {
        const fs = appState.fallenStars[i];
        const fx = fs.xNorm * viewW;
        const fy = fs.landOnLake ? waterY + 2 + Math.sin(now * 0.003 + fs.phase) * 2 : getHillSurfaceY(fx) - 6;
        const pulse = 0.7 + 0.3 * Math.sin(now * 0.004 + fs.phase);

        const fGrad = ctx.createRadialGradient(fx, fy, 1, fx, fy, 18 * pulse);
        const starTint = fs.payload.kind === `user` ? `rgba(124, 196, 232, ` : `rgba(223, 170, 91, `;
        fGrad.addColorStop(0, `rgba(255, 250, 240, 0.95)`);
        fGrad.addColorStop(0.45, starTint + `0.55)`);
        fGrad.addColorStop(1, starTint + `0)`);
        ctx.fillStyle = fGrad;
        ctx.beginPath();
        ctx.arc(fx, fy, 18 * pulse, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `#fffaf0`;
        ctx.beginPath();
        ctx.arc(fx, fy, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }

      // 13. Other Players (Black Silhouette + Unique Accessory)
      const peers = getActiveRoomMembers(appState.currentPlanet);
      for (let i = 0; i < peers.length; i++) {
        const peer = peers[i];
        const px = peer.xNorm * viewW;
        const py = getWalkableSurfaceY(px) + (peer.yOffset || 0);
        drawCloakedTraveler(ctx, px, py, {
          isMine: false,
          isAdmin: false,
          accessory: peer.accessory,
          wetRatio: peer.wetRatio || 0,
          facing: peer.facing || 1,
          walkPhase: peer.walkPhase || 0,
          name: peer.name
        });
      }

      // 14. My Character (White outline glow + Name tag + Admin Red Cloak if unlocked)
      const myPx = appState.player.xNorm * viewW;
      const myPy = getWalkableSurfaceY(myPx) + appState.player.yOffset;
      drawCloakedTraveler(ctx, myPx, myPy, {
        isMine: true,
        isAdmin: appState.isAdmin,
        accessory: `none`,
        wetRatio: appState.player.wetRatio,
        facing: appState.player.facing,
        walkPhase: appState.player.walkPhase,
        name: appState.playerName
      });

      // Wet cloak droplets
      for (let i = appState.waterDroplets.length - 1; i >= 0; i--) {
        const dr = appState.waterDroplets[i];
        dr.y += dr.vy * dt;
        dr.alpha -= dt * 1.4;
        if (dr.alpha <= 0) {
          appState.waterDroplets.splice(i, 1);
          continue;
        }
        ctx.fillStyle = `rgba(124, 196, 232, ${dr.alpha})`;
        ctx.beginPath();
        ctx.arc(dr.x, dr.y, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }

      // 15. Fireflies over the Hill
      for (let i = 0; i < fireflies.length; i++) {
        const f = fireflies[i];
        const fx = f.xNorm * viewW;
        const fy = getHillSurfaceY(fx) - f.yOffset;
        const glow = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(now * 0.0028 + f.phase));
        const ffGrad = ctx.createRadialGradient(fx, fy, 0.5, fx, fy, 9);
        ffGrad.addColorStop(0, `rgba(226, 245, 138, ${glow})`);
        ffGrad.addColorStop(1, `rgba(226, 245, 138, 0)`);
        ctx.fillStyle = ffGrad;
        ctx.beginPath();
        ctx.arc(fx, fy, 9, 0, Math.PI * 2);
        ctx.fill();
      }

      // 16. Emotion Star Particles (Warmth, Comfort, Gratitude)
      for (let i = appState.emotionParticles.length - 1; i >= 0; i--) {
        const ep = appState.emotionParticles[i];
        ep.t += dt * ep.speed;
        if (ep.t >= 1) {
          appState.emotionParticles.splice(i, 1);
          continue;
        }
        const ease = 1 - Math.pow(1 - ep.t, 3);
        const ex = ep.x + (ep.tx - ep.x) * ease;
        const arcY = Math.sin(ep.t * Math.PI) * 58;
        const ey = ep.y + (ep.ty - ep.y) * ease - arcY;
        ctx.save();
        ctx.globalAlpha = 1 - ep.t * 0.65;
        ctx.fillStyle = ep.color;
        ctx.beginPath();
        ctx.arc(ex, ey, ep.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 17. Release Light Particles
      for (let i = appState.releaseParticles.length - 1; i >= 0; i--) {
        const rp = appState.releaseParticles[i];
        rp.x += rp.vx * dt;
        rp.y += rp.vy * dt;
        rp.alpha -= dt * 0.65;
        if (rp.alpha <= 0) {
          appState.releaseParticles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = `rgba(245, 220, 176, ${rp.alpha})`;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(renderFrame);
    }

    /* =========================================================================
       18. Bootstrap
       ========================================================================= */
    async function initApp() {
      if (window.lucide && typeof window.lucide.createIcons === `function`) {
        window.lucide.createIcons();
      }
      initAmbientSceneParticles();
      initFellowTravelers();
      resizeCanvas();
      window.addEventListener(`resize`, resizeCanvas);

      initJoystick();
      await loadPersistedState();

      // Announce presence & auto-route planet room (max 5 per room)
      sendMyPresence();
      setTimeout(assignPlanetRoomOnJoin, 250);
      setInterval(sendMyPresence, 2000);

      requestAnimationFrame(renderFrame);

      if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === `function`) {
        window.notebookAppApi.notifyAppReady();
      }
    }

    initApp();
  </script>
</body>
