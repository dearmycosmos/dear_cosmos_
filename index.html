<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="artifact-type" content="tool">
  <meta name="design-style" content="nocturne">
  <title>Dear my cosmos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.43.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: dark;

      /* Nocturne base tokens */
      --background: #0a101d;
      --surface-container-low: #0e1626;
      --surface-container: #111b2e;
      --surface-container-high: #17243c;
      --on-surface: #f2ece1;
      --on-surface-variant: #9ba8bf;
      --outline: #384d73;
      --outline-variant: #21304d;
      --primary: #dfaa5b;
      --on-primary: #0a101d;
      --primary-container: #2b261c;
      --on-primary-container: #f5dcb0;
      --secondary: #687a99;
      --tertiary: #7cc4e8;
      --error: #f27474;
      --on-error: #1a0606;
      --positive: #52d19c;
      --warning: #e8b85a;
      --focus: #dfaa5b;

      /* Data & Emotion tokens */
      --data-1: #dfaa5b;
      --data-2: #7cc4e8;
      --data-3: #52d19c;
      --data-4: #e07a5f;
      --data-context: #4a5d80;
      --emotion-warmth: #ff9a52;
      --emotion-comfort: #6ec3f4;
      --emotion-gratitude: #ffd166;
      --admin-crimson: #d6455d;
      --admin-crimson-bg: rgba(214, 69, 93, 0.16);
      --admin-crimson-border: rgba(214, 69, 93, 0.48);

      /* Paper / Letter surfaces */
      --paper-cream: #f4ead5;
      --paper-cream-edge: #e5d4b3;
      --paper-cream-shadow: rgba(10, 16, 29, 0.55);
      --paper-ink: #2c241b;
      --paper-ink-muted: #6e5d49;
      --paper-tear-patch: rgba(235, 220, 192, 0.92);

      /* Glass & Overlay surfaces */
      --hud-glass: rgba(14, 22, 38, 0.72);
      --hud-glass-strong: rgba(17, 27, 46, 0.88);
      --modal-backdrop: rgba(6, 10, 19, 0.72);
      --title-glow: 0 2px 24px rgba(242, 236, 225, 0.28);
      --brass-shadow: 0 8px 28px rgba(223, 170, 91, 0.18);
      --panel-shadow: 0 20px 54px rgba(4, 8, 16, 0.65);

      /* Fonts */
      --font-headline: 'EB Garamond', 'Noto Serif KR', serif;
      --font-body: 'Noto Sans KR', 'Plus Jakarta Sans', sans-serif;
      --font-label: 'JetBrains Mono', 'Noto Sans KR', monospace;
      --font-letter: 'Noto Serif KR', 'EB Garamond', serif;

      /* Type scale */
      --display-size: clamp(1.85rem, 1.35rem + 1.8vw, 2.75rem);
      --headline-size: clamp(1.25rem, 1.1rem + 0.5vw, 1.5rem);
      --subhead-size: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
      --body-size: clamp(0.9375rem, 0.9rem + 0.15vw, 1rem);
      --label-size: 0.75rem;

      /* Spacing */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2.5rem;
      --space-2xl: 4rem;

      /* Radii & Effects */
      --rounded: 0.375rem;
      --rounded-lg: 0.75rem;
      --rounded-xl: 1rem;
      --rounded-full: 9999px;
      --hairline: 1px solid var(--outline-variant);
      --hairline-strong: 1px solid var(--outline);
      --panel-highlight: inset 0 1px 0 rgba(242, 236, 225, 0.07);
      --brass-glow: radial-gradient(circle at 88% 12%, rgba(223, 170, 91, 0.08), transparent 45%);
      --sky-tint: color-mix(in srgb, var(--tertiary) 14%, transparent);
      --brass-tint: color-mix(in srgb, var(--primary) 16%, transparent);
      --heading-tracking: -0.015em;
      --label-tracking: 0.06em;

      /* Motion */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-micro: 120ms;
      --dur-short: 220ms;
      --dur-long: 420ms;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      overflow-x: clip;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--background);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: var(--body-size);
      line-height: 1.6;
      word-break: keep-all;
      overflow-wrap: break-word;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    header {
      position: static !important;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* Fullscreen Interactive Sky & Terrain Stage */
    .world-stage {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      min-height: 480px;
      background-color: var(--background);
    }

    #cosmos-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    /* Foreground UI Overlay */
    .hud-layer {
      position: relative;
      z-index: 10;
      min-height: 100dvh;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: var(--space-lg);
    }

    .hud-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-md);
      flex-wrap: wrap;
    }

    .cosmos-title {
      margin: 0;
      font-family: 'EB Garamond', serif;
      font-weight: 500;
      font-size: var(--display-size);
      line-height: 1.08;
      letter-spacing: var(--heading-tracking);
      color: var(--on-surface);
      text-shadow: var(--title-glow);
      pointer-events: auto;
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .hud-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      min-height: 44px;
      min-width: 44px;
      padding: var(--space-xs) var(--space-md);
      background-color: var(--hud-glass);
      border: var(--hairline);
      border-radius: var(--rounded-full);
      box-shadow: var(--panel-highlight);
      color: var(--on-surface);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out);
    }

    .hud-btn:hover {
      background-color: var(--surface-container-high);
      border-color: var(--outline);
    }

    .hud-btn:active {
      transform: scale(0.97);
    }

    .hud-btn.is-active {
      background-color: var(--brass-tint);
      border-color: var(--primary);
      color: var(--on-primary-container);
    }

    .hud-btn.admin-btn {
      background-color: var(--admin-crimson-bg);
      border-color: var(--admin-crimson-border);
      color: var(--on-surface);
    }

    .hud-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .badge-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 var(--space-xs);
      border-radius: var(--rounded-full);
      background-color: var(--brass-tint);
      color: var(--primary);
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 600;
    }

    .planet-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--rounded-full);
      background-color: var(--positive);
      flex-shrink: 0;
    }

    /* Audio Popover Panel */
    .audio-anchor {
      position: relative;
    }

    .audio-popover {
      position: absolute;
      top: calc(100% + var(--space-sm));
      right: 0;
      width: min(310px, calc(100vw - 2rem));
      background-color: var(--hud-glass-strong);
      background-image: var(--brass-glow);
      border: var(--hairline-strong);
      border-radius: var(--rounded-lg);
      box-shadow: var(--panel-shadow), var(--panel-highlight);
      padding: var(--space-md);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: none;
      flex-direction: column;
      gap: var(--space-md);
      z-index: 30;
    }

    .audio-popover.open {
      display: flex;
    }

    .popover-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
    }

    .popover-title {
      margin: 0;
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--on-surface);
    }

    .bgm-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-xs);
    }

    .bgm-choice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: var(--space-xs) var(--space-sm);
      background-color: var(--surface-container-low);
      border: var(--hairline);
      border-radius: var(--rounded);
      font-size: 0.875rem;
      cursor: pointer;
      transition: background-color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out);
    }

    .bgm-choice:hover {
      background-color: var(--surface-container-high);
    }

    .bgm-choice.selected {
      background-color: var(--brass-tint);
      border-color: var(--primary);
      color: var(--on-primary-container);
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .slider-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8125rem;
      color: var(--on-surface-variant);
    }

    .slider-val {
      font-family: var(--font-label);
      font-size: var(--label-size);
      color: var(--tertiary);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
      height: 6px;
    }

    /* Bottom HUD & Virtual Joystick */
    .hud-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--space-md);
      width: 100%;
    }

    .joystick-cluster {
      display: none;
      align-items: center;
      gap: var(--space-md);
      pointer-events: auto;
    }

    .joystick-cluster.visible {
      display: flex;
    }

    .joystick-base {
      position: relative;
      width: 108px;
      height: 108px;
      border-radius: var(--rounded-full);
      background-color: var(--hud-glass);
      border: var(--hairline-strong);
      box-shadow: var(--panel-highlight);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      touch-action: none;
    }

    .joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 46px;
      height: 46px;
      margin-left: -23px;
      margin-top: -23px;
      border-radius: var(--rounded-full);
      background-color: var(--primary);
      box-shadow: var(--brass-shadow);
      pointer-events: none;
      transition: transform var(--dur-micro) var(--ease-out);
    }

    .jump-pad-btn {
      width: 60px;
      height: 60px;
      border-radius: var(--rounded-full);
      background-color: var(--hud-glass);
      border: var(--hairline-strong);
      color: var(--on-surface);
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .jump-pad-btn:active {
      background-color: var(--brass-tint);
      border-color: var(--primary);
    }

    .toast-pill {
      margin: 0 auto;
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--rounded-full);
      background-color: var(--hud-glass-strong);
      border: var(--hairline-strong);
      box-shadow: var(--panel-shadow);
      color: var(--on-surface);
      font-size: 0.875rem;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out);
      pointer-events: none;
      text-align: center;
      max-width: min(440px, 90vw);
    }

    .toast-pill.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background-color: var(--modal-backdrop);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      width: min(520px, 100%);
      max-height: 88dvh;
      overflow-y: auto;
      background-color: var(--surface-container);
      background-image: var(--brass-glow);
      border: var(--hairline-strong);
      border-radius: var(--rounded-xl);
      box-shadow: var(--panel-shadow), var(--panel-highlight);
      padding: var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .modal-card.wide {
      width: min(740px, 100%);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
    }

    .modal-title {
      margin: 0;
      font-family: var(--font-headline);
      font-size: var(--headline-size);
      font-weight: 500;
      color: var(--on-surface);
    }

    .close-icon-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: var(--rounded-full);
      border: var(--hairline);
      background-color: var(--surface-container-low);
      color: var(--on-surface-variant);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .close-icon-btn:hover {
      background-color: var(--surface-container-high);
      color: var(--on-surface);
    }

    .field-block {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .field-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--on-surface-variant);
    }

    .field-required {
      color: var(--primary);
      margin-left: var(--space-xs);
    }

    .text-input, .text-area {
      width: 100%;
      padding: var(--space-sm) var(--space-md);
      background-color: var(--background);
      border: var(--hairline-strong);
      border-radius: var(--rounded);
      color: var(--on-surface);
      font-size: var(--body-size);
      line-height: 1.5;
    }

    .text-area {
      min-height: 132px;
      resize: vertical;
    }

    .form-feedback {
      min-height: 1.25rem;
      font-size: 0.875rem;
      color: var(--error);
      margin: 0;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-sm);
      flex-wrap: wrap;
      margin-top: var(--space-xs);
    }

    .btn-primary, .btn-secondary, .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      min-height: 44px;
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--rounded);
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out);
    }

    .btn-primary {
      background-color: var(--primary);
      border: 1px solid var(--primary);
      color: var(--on-primary);
    }

    .btn-primary:hover {
      background-color: var(--on-primary-container);
    }

    .btn-secondary {
      background-color: var(--surface-container-high);
      border: var(--hairline-strong);
      color: var(--on-surface);
    }

    .btn-secondary:hover {
      background-color: var(--outline-variant);
    }

    .btn-ghost {
      background-color: transparent;
      border: var(--hairline);
      color: var(--on-surface-variant);
    }

    .btn-ghost:hover {
      background-color: var(--surface-container-high);
      color: var(--on-surface);
    }

    /* Reading Letter Card & Torn Cream Paper Effect */
    .letter-paper {
      position: relative;
      padding: var(--space-xl);
      background-color: var(--surface-container-low);
      border: var(--hairline);
      border-radius: var(--rounded-lg);
      font-family: var(--font-letter);
      line-height: 1.85;
      color: var(--on-surface);
    }

    .letter-paper.torn-cream {
      background-color: var(--paper-cream);
      color: var(--paper-ink);
      border-color: var(--paper-cream-edge);
      box-shadow: 0 14px 36px var(--paper-cream-shadow);
      clip-path: polygon(
        0% 2%, 7% 0%, 15% 3%, 24% 0.5%, 35% 2.5%, 48% 0%, 60% 2%, 72% 0%, 84% 3%, 93% 1%, 100% 3%,
        98% 15%, 100% 29%, 97.5% 43%, 100% 58%, 98% 74%, 100% 88%, 97% 98%,
        86% 100%, 73% 97.5%, 61% 100%, 49% 98%, 34% 100%, 21% 97.5%, 9% 100%, 1% 97%,
        2.5% 83%, 0% 69%, 2% 52%, 0% 36%, 2% 19%
      );
      padding: var(--space-xl) var(--space-lg);
    }

    .tear-scrap {
      position: absolute;
      pointer-events: none;
      background-color: var(--paper-tear-patch);
      border: 1px dashed var(--paper-cream-edge);
      box-shadow: 0 4px 10px var(--paper-cream-shadow);
    }

    .tear-scrap-top {
      top: 12%;
      right: -6px;
      width: 78px;
      height: 36px;
      transform: rotate(7deg);
      clip-path: polygon(8% 0%, 100% 10%, 94% 92%, 0% 82%, 14% 46%);
    }

    .tear-scrap-bottom {
      bottom: 14%;
      left: -6px;
      width: 88px;
      height: 38px;
      transform: rotate(-6deg);
      clip-path: polygon(0% 12%, 90% 0%, 100% 78%, 74% 100%, 5% 86%);
    }

    .torn-concealed {
      display: inline-block;
      background-color: var(--paper-cream-edge);
      color: transparent;
      border-radius: var(--rounded);
      padding: 0 var(--space-xs);
      transform: rotate(-1.5deg);
    }

    .letter-meta-line {
      font-size: 0.9375rem;
      font-weight: 600;
      margin-bottom: var(--space-sm);
      color: var(--primary);
    }

    .letter-paper.torn-cream .letter-meta-line {
      color: var(--paper-ink-muted);
    }

    .letter-body-text {
      margin: var(--space-sm) 0;
      white-space: pre-wrap;
      font-size: 1.0625rem;
    }

    .letter-from-line {
      margin-top: var(--space-md);
      text-align: right;
      font-size: 0.9375rem;
      color: var(--on-surface-variant);
    }

    .letter-paper.torn-cream .letter-from-line {
      color: var(--paper-ink-muted);
    }

    .letter-source-tag {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      font-family: var(--font-label);
      font-size: var(--label-size);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--rounded);
      background-color: var(--sky-tint);
      color: var(--tertiary);
    }

    /* Constellation Archive */
    .constellation-sky {
      position: relative;
      width: 100%;
      min-height: 240px;
      height: 240px;
      background-color: var(--background);
      border: var(--hairline);
      border-radius: var(--rounded-lg);
      overflow: hidden;
    }

    #constellation-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    .archive-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
      gap: var(--space-sm);
      max-height: 240px;
      overflow-y: auto;
    }

    .archive-item {
      text-align: left;
      padding: var(--space-md);
      background-color: var(--surface-container-low);
      border: var(--hairline);
      border-radius: var(--rounded);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      transition: border-color var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
    }

    .archive-item:hover, .archive-item.selected {
      background-color: var(--surface-container-high);
      border-color: var(--primary);
    }

    .archive-item-title {
      font-weight: 600;
      font-size: 0.9375rem;
      color: var(--on-surface);
    }

    .archive-item-snippet {
      font-size: 0.8125rem;
      color: var(--on-surface-variant);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 1:1 Chat & Emotion Stars Drawer */
    .chat-box {
      position: fixed;
      right: var(--space-lg);
      bottom: var(--space-lg);
      z-index: 40;
      width: min(350px, calc(100vw - 2rem));
      background-color: var(--hud-glass-strong);
      border: var(--hairline-strong);
      border-radius: var(--rounded-xl);
      box-shadow: var(--panel-shadow), var(--panel-highlight);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: var(--space-md);
      display: none;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .chat-box.open {
      display: flex;
    }

    .chat-messages {
      height: 170px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      padding: var(--space-sm);
      background-color: var(--background);
      border: var(--hairline);
      border-radius: var(--rounded);
    }

    .chat-bubble {
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--rounded);
      font-size: 0.875rem;
      max-width: 85%;
    }

    .chat-bubble.mine {
      align-self: flex-end;
      background-color: var(--brass-tint);
      border: 1px solid var(--primary);
      color: var(--on-surface);
    }

    .chat-bubble.theirs {
      align-self: flex-start;
      background-color: var(--surface-container-high);
      border: var(--hairline);
      color: var(--on-surface);
    }

    .emotion-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-xs);
    }

    .emotion-btn {
      min-height: 44px;
      padding: var(--space-xs);
      border-radius: var(--rounded);
      border: var(--hairline);
      background-color: var(--surface-container-low);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
    }

    .emotion-btn.warmth {
      color: var(--emotion-warmth);
    }

    .emotion-btn.comfort {
      color: var(--emotion-comfort);
    }

    .emotion-btn.gratitude {
      color: var(--emotion-gratitude);
    }

    .emotion-btn:hover {
      background-color: var(--surface-container-high);
      border-color: var(--outline);
    }

    .chat-input-row {
      display: flex;
      align-items: flex-end;
      gap: var(--space-xs);
    }

    /* Planet & Admin Lists */
    .planet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr));
      gap: var(--space-sm);
    }

    .planet-card {
      padding: var(--space-md);
      background-color: var(--surface-container-low);
      border: var(--hairline);
      border-radius: var(--rounded);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      cursor: pointer;
      text-align: left;
    }

    .planet-card.active {
      border-color: var(--primary);
      background-color: var(--brass-tint);
    }

    .admin-table-wrap {
      max-height: 360px;
      overflow-y: auto;
      border: var(--hairline);
      border-radius: var(--rounded);
      background-color: var(--background);
    }

    .admin-letter-row {
      padding: var(--space-md);
      border-bottom: var(--hairline);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .admin-letter-row:last-child {
      border-bottom: none;
    }

    .mono-meta {
      font-family: var(--font-label);
      font-size: var(--label-size);
      color: var(--tertiary);
    }

    .empty-state {
      padding: var(--space-lg);
      text-align: center;
      color: var(--on-surface-variant);
      background-color: var(--surface-container-low);
      border: var(--hairline);
      border-radius: var(--rounded);
    }

    @media (max-width: 640px) {
      .hud-layer {
        padding: var(--space-md);
      }

      .hud-header {
        align-items: center;
      }

      .hud-btn .btn-text-hide-sm {
        display: none;
      }

      .modal-card {
        padding: var(--space-lg);
      }

      .chat-box {
        right: var(--space-md);
        bottom: var(--space-md);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

          <span class="btn-text-hide-sm">별자리 보관함</span>
          <span class="badge-count" id="hud-archive-count">0</span>
        </button>

        <button type="button" class="hud-btn" id="btn-joystick-toggle" onclick="toggleJoystickVisibility()" aria-label="모바일 조이스틱 전환">

          <i data-lucide="shield" aria-hidden="true"></i>
          <span class="btn-text-hide-sm">Admin</span>
        </button>

        <div class="audio-anchor">
          <button type="button" class="hud-btn" id="btn-volume-icon" onclick="handleVolumeIconClick()" aria-label="사운드 설정 및 볼륨">
            <i data-lucide="volume-2" id="volume-icon-svg" aria-hidden="true"></i>
          </button>

          <div class="audio-popover" id="audio-popover" role="dialog" aria-label="오디오 설정">
            <div class="popover-title-row">
              <h2 class="popover-title">소리 및 배경음악</h2>
              <button type="button" class="btn-ghost" id="btn-bgm-toggle" onclick="toggleAudioMute()" style="min-height: 36px; padding: 0 var(--space-sm);">
                <span id="bgm-toggle-label">켜짐</span>
              </button>
            </div>

            <div class="bgm-grid" role="radiogroup" aria-label="배경음악 선택">
              <button type="button" class="bgm-choice selected" id="bgm-opt-piano" onclick="selectBgmTrack('piano')">
                <span>부드러운 피아노</span>
                <span class="mono-meta">Soft Piano</span>
              </button>

                <span class="mono-meta">Night Music Box</span>
              </button>
              <button type="button" class="bgm-choice" id="bgm-opt-guitar" onclick="selectBgmTrack('guitar')">
                <span>어쿠스틱 기타</span>
                <span class="mono-meta">Acoustic Guitar</span>
              </button>
            </div>

            <div class="slider-group">
              <div class="slider-label-row">
                <label for="slider-bgm">배경음악 (BGM)</label>
                <span class="slider-val" id="val-bgm">65%</span>
              </div>
              <input type="range" id="slider-bgm" min="0" max="100" value="65" oninput="updateVolumeSlider('bgm', this.value)">
            </div>

            <div class="slider-group">
              <div class="slider-label-row">
                <label for="slider-sfx">효과음 (SFX)</label>
                <span class="slider-val" id="val-sfx">75%</span>
              </div>
              <input type="range" id="slider-sfx" min="0" max="100" value="75" oninput="updateVolumeSlider('sfx', this.value)">
            </div>

            <div class="slider-group">
              <div class="slider-label-row">
                <label for="slider-water">물 발자국 소리</label>
                <span class="slider-val" id="val-water">70%</span>
              </div>
              <input type="range" id="slider-water" min="0" max="100" value="70" oninput="updateVolumeSlider('water', this.value)">
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="hud-bottom">
      <div class="joystick-cluster" id="joystick-cluster">

      <div style="width: 1px;"></div>

  <!-- Reading Modal -->
  <div class="modal-overlay" id="modal-read" role="dialog" aria-modal="true" aria-labelledby="read-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="read-modal-title">내려앉은 별빛의 조각</h2>

      <div class="modal-header">

  <script>

       2. Sky Color Palettes (Deep Indigo, Purple, Dark Navy, Romantic Pink)
       ========================================================================= */
    const SKY_PALETTES = [
      {
        name: `Deep Indigo`,

    const ROOM_CAP = 5;

    async function loadPersistedState() {

    function broadcastEvent(payload) {

    /* =========================================================================
       5. Planet Room Cap (Max 5 per room) & Multiplayer Travelers
       ========================================================================= */
    const peerDirectory = {}; // real cross-tab peers keyed by sessionId
    const npcTravelers = [];  // peaceful fellow silhouette travelers for solo exploration
    let simulatedOverflowCount = 0;

    function initFellowTravelers() {
      // Create 2 calm fellow silhouette travelers on Planet 1 so visitors immediately experience
      // accessories, 1:1 chat prompts, and emotion star particles even without a second tab open.
      // Note: Simulated travelers NEVER generate or send letters (0% AI letters).
      npcTravelers.length = 0;
      const presets = [
        { id: `peer_sim_1`, name: `푸른 목도리 여행자`, planet: 1, xNorm: 0.17, targetXNorm: 0.17, accessory: `blue_scarf`, isNpc: true },
        { id: `peer_sim_2`, name: `초록 모자 여행자`, planet: 1, xNorm: 0.44, targetXNorm: 0.44, accessory: `green_hat`, isNpc: true },
        { id: `peer_sim_3`, name: `파란 안경 여행자`, planet: 1, xNorm: 0.63, targetXNorm: 0.63, accessory: `blue_glasses`, isNpc: true },
        { id: `peer_sim_4`, name: `분홍 리본 여행자`, planet: 2, xNorm: 0.34, targetXNorm: 0.34, accessory: `pink_ribbon`, isNpc: true },
        { id: `peer_sim_5`, name: `노란 넥타이 여행자`, planet: 2, xNorm: 0.68, targetXNorm: 0.68, accessory: `yellow_tie`, isNpc: true }
      ];
      for (let i = 0; i < presets.length; i++) {

        });

    }

    function getActiveRoomMembers(planetNum) {
      const now = performance.now();
      const list = [];
      // Real cross-tab peers
      const keys = Object.keys(peerDirectory);
      for (let i = 0; i < keys.length; i++) {
        const peer = peerDirectory[keys[i]];
        if (now - peer.lastSeen < 8000 && peer.planet === planetNum) {
          list.push(peer);
        }
      }
      // Simulated fellow travelers
      for (let i = 0; i < npcTravelers.length; i++) {
        if (npcTravelers[i].planet === planetNum) {
          list.push(npcTravelers[i]);
        }
      }
      return list;
    }

    function assignPlanetRoomOnJoin() {
      let planet = 1;
      while (true) {
        const peersInRoom = getActiveRoomMembers(planet);
        const totalWithMe = peersInRoom.length + 1 + (planet === 1 ? simulatedOverflowCount : 0);
        if (totalWithMe <= ROOM_CAP) {
          appState.currentPlanet = planet;
          break;
        }
        planet += 1;
        if (planet > 10) {
          appState.currentPlanet = planet;
          break;
        }
      }
      updateHudBadges();
    }

    function handleRealtimeMessage(msg) {
      if (!msg || msg.senderId === SESSION_ID) return;
      if (msg.type === `presence`) {
        peerDirectory[msg.senderId] = {
          id: msg.senderId,
          name: msg.name || `여행자`,
          planet: msg.planet || 1,
          xNorm: typeof msg.xNorm === `number` ? msg.xNorm : 0.3,
          targetXNorm: typeof msg.xNorm === `number` ? msg.xNorm : 0.3,
          yOffset: msg.yOffset || 0,
          facing: msg.facing || 1,
          walkPhase: msg.walkPhase || 0,
          accessory: msg.accessory || `blue_glasses`,
          wetRatio: msg.wetRatio || 0,
          isNpc: false,
          lastSeen: performance.now()
        };
        updateHudBadges();
      } else if (msg.type === `global_letter` && msg.letter) {
        const exists = appState.globalUserLetters.some(function (l) { return l.id === msg.letter.id; });
        if (!exists) {
          appState.globalUserLetters.push(msg.letter);
          savePersistedState();
        }
      } else if (msg.type === `chat_message` && msg.targetId === SESSION_ID) {
        appendChatMessage(msg.senderId, false, msg.text, msg.senderName);
        if (!appState.chatTargetPeer) {
          const peer = peerDirectory[msg.senderId];
          if (peer) openActiveChatWith(peer);
        }
      } else if (msg.type === `emotion_star` && msg.targetId === SESSION_ID) {
        const peer = peerDirectory[msg.senderId];
        if (peer) spawnEmotionBurst(peer.xNorm, appState.player.xNorm, msg.emotion);
      }

      });

    /* =========================================================================
       6. Web Audio Synthesizer (BGM: Piano/MusicBox/Guitar + Violin + Xylophone + Water)
       ========================================================================= */
    let audioCtx = null;
    let bgmGain = null;
    let sfxGain = null;
    let waterGain = null;
    let bgmTimerId = null;
    let bgmStep = 0;

    function ensureAudioContext() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
        bgmGain = audioCtx.createGain();
        sfxGain = audioCtx.createGain();
        waterGain = audioCtx.createGain();
        bgmGain.gain.value = appState.audioMuted ? 0 : appState.volBgm * 0.24;
        sfxGain.gain.value = appState.audioMuted ? 0 : appState.volSfx * 0.35;
        waterGain.gain.value = appState.audioMuted ? 0 : appState.volWater * 0.28;
        bgmGain.connect(audioCtx.destination);
        sfxGain.connect(audioCtx.destination);
        waterGain.connect(audioCtx.destination);
        startBgmLoop();
      }
      if (audioCtx.state === `suspended`) {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function applyAudioVolumes() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      if (bgmGain) bgmGain.gain.setTargetAtTime(appState.audioMuted ? 0 : appState.volBgm * 0.24, now, 0.06);
      if (sfxGain) sfxGain.gain.setTargetAtTime(appState.audioMuted ? 0 : appState.volSfx * 0.35, now, 0.06);
      if (waterGain) waterGain.gain.setTargetAtTime(appState.audioMuted ? 0 : appState.volWater * 0.28, now, 0.06);
    }

    function playBgmNote(freq, duration, timbre) {
      if (!audioCtx || appState.audioMuted || appState.volBgm <= 0.01) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const env = audioCtx.createGain();

      if (timbre === `piano`) {
        osc.type = `triangle`;
        osc2.type = `sine`;
        osc.frequency.setValueAtTime(freq, now);
        osc2.frequency.setValueAtTime(freq * 2, now);
        filter.type = `lowpass`;
        filter.frequency.setValueAtTime(1400, now);
        env.gain.setValueAtTime(0.0001, now);
        env.gain.linearRampToValueAtTime(0.32, now + 0.025);
        env.gain.exponentialRampToValueAtTime(0.001, now + duration);
      } else if (timbre === `musicbox`) {
        osc.type = `sine`;
        osc2.type = `sine`;
        osc.frequency.setValueAtTime(freq * 2, now);
        osc2.frequency.setValueAtTime(freq * 4, now);
        filter.type = `lowpass`;
        filter.frequency.setValueAtTime(3600, now);
        env.gain.setValueAtTime(0.0001, now);
        env.gain.linearRampToValueAtTime(0.22, now + 0.008);
        env.gain.exponentialRampToValueAtTime(0.0008, now + duration * 0.85);
      } else {
        // acoustic guitar
        osc.type = `triangle`;
        osc2.type = `sawtooth`;
        osc.frequency.setValueAtTime(freq, now);
        osc2.frequency.setValueAtTime(freq, now);
        filter.type = `lowpass`;
        filter.frequency.setValueAtTime(1900, now);
        filter.frequency.exponentialRampToValueAtTime(520, now + duration * 0.7);
        env.gain.setValueAtTime(0.0001, now);
        env.gain.linearRampToValueAtTime(0.26, now + 0.012);
        env.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.9);
      }

      const subGain = audioCtx.createGain();
      subGain.gain.value = timbre === `musicbox` ? 0.25 : 0.16;

      osc.connect(filter);
      osc2.connect(subGain);
      subGain.connect(filter);
      filter.connect(env);
      env.connect(bgmGain);

      osc.start(now);
      osc2.start(now);
      osc.stop(now + duration + 0.05);
      osc2.stop(now + duration + 0.05);
    }

    function startBgmLoop() {
      if (bgmTimerId) clearInterval(bgmTimerId);
      const progression = [
        [293.66, 440.00, 554.37, 659.25], // Dmaj9
        [246.94, 369.99, 440.00, 587.33], // Bm7
        [196.00, 293.66, 369.99, 493.88], // Gmaj7
        [220.00, 329.63, 440.00, 554.37]  // A6
      ];
      bgmTimerId = setInterval(function () {
        if (!audioCtx || audioCtx.state !== `running` || appState.audioMuted) return;
        const bar = Math.floor(bgmStep / 4) % progression.length;
        const noteIdx = bgmStep % 4;
        const chord = progression[bar];
        const freq = chord[noteIdx];
        const dur = appState.bgmTrack === `musicbox` ? 1.6 : (appState.bgmTrack === `guitar` ? 1.8 : 2.3);
        playBgmNote(freq, dur, appState.bgmTrack);
        if (noteIdx === 0) {
          playBgmNote(chord[0] * 0.5, dur * 1.2, appState.bgmTrack);
        }
        bgmStep += 1;
      }, 780);
    }

    function playViolinHarmony(freq, delaySec) {
      const ctx = ensureAudioContext();
      if (!ctx || appState.audioMuted || appState.volSfx <= 0.01) return;
      const start = ctx.currentTime + delaySec;
      const dur = 2.4;

      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const vibrato = ctx.createOscillator();
      const vibratoGain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      const env = ctx.createGain();

      osc1.type = `sawtooth`;
      osc2.type = `triangle`;
      osc1.frequency.setValueAtTime(freq, start);
      osc2.frequency.setValueAtTime(freq * 1.002, start);

      vibrato.frequency.setValueAtTime(5.2, start);
      vibratoGain.gain.setValueAtTime(3.2, start);
      vibrato.connect(vibratoGain);
      vibratoGain.connect(osc1.frequency);
      vibratoGain.connect(osc2.frequency);

      filter.type = `bandpass`;
      filter.frequency.setValueAtTime(freq * 2.1, start);
      filter.Q.setValueAtTime(1.4, start);

      env.gain.setValueAtTime(0.0001, start);
      env.gain.linearRampToValueAtTime(0.18, start + 0.45);
      env.gain.linearRampToValueAtTime(0.13, start + 1.5);
      env.gain.exponentialRampToValueAtTime(0.0008, start + dur);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(env);
      env.connect(sfxGain);

      osc1.start(start);
      osc2.start(start);
      vibrato.start(start);
      osc1.stop(start + dur + 0.05);
      osc2.stop(start + dur + 0.05);
      vibrato.stop(start + dur + 0.05);
    }

    function playXylophoneChime() {
      const ctx = ensureAudioContext();
      if (!ctx || appState.audioMuted || appState.volSfx <= 0.01) return;
      const notes = [783.99, 987.77, 1174.66];
      for (let i = 0; i < notes.length; i++) {
        const start = ctx.currentTime + i * 0.09;
        const osc = ctx.createOscillator();
        const over = ctx.createOscillator();
        const env = ctx.createGain();
        osc.type = `sine`;
        over.type = `sine`;
        osc.frequency.setValueAtTime(notes[i], start);
        over.frequency.setValueAtTime(notes[i] * 3, start);
        const overGain = ctx.createGain();
        overGain.gain.value = 0.14;

        env.gain.setValueAtTime(0.001, start);
        env.gain.linearRampToValueAtTime(0.28, start + 0.01);
        env.gain.exponentialRampToValueAtTime(0.0008, start + 0.85);

        osc.connect(env);
        over.connect(overGain);
        overGain.connect(env);
        env.connect(sfxGain);

        osc.start(start);
        over.start(start);
        osc.stop(start + 0.9);
        over.stop(start + 0.9);
      }
    }

    function playSparkleChime(baseFreq) {
      const ctx = ensureAudioContext();
      if (!ctx || appState.audioMuted || appState.volSfx <= 0.01) return;
      const start = ctx.currentTime;
      const osc = ctx.createOscillator();
      const env = ctx.createGain();
      osc.type = `sine`;
      osc.frequency.setValueAtTime(baseFreq || 880, start);
      osc.frequency.exponentialRampToValueAtTime((baseFreq || 880) * 1.25, start + 0.35);
      env.gain.setValueAtTime(0.001, start);
      env.gain.linearRampToValueAtTime(0.2, start + 0.02);
      env.gain.exponentialRampToValueAtTime(0.001, start + 0.55);
      osc.connect(env);
      env.connect(sfxGain);
      osc.start(start);
      osc.stop(start + 0.6);
    }

    let lastWaterSoundAt = 0;
    function playWaterFootstep(intensity) {
      const nowMs = performance.now();
      if (nowMs - lastWaterSoundAt < 260) return;
      lastWaterSoundAt = nowMs;

      const ctx = ensureAudioContext();
      if (!ctx || appState.audioMuted || appState.volWater <= 0.01) return;
      const now = ctx.currentTime;

      // Filtered white noise splash
      const bufferSize = Math.floor(ctx.sampleRate * 0.16);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = `bandpass`;
      filter.frequency.setValueAtTime(900 + Math.random() * 450, now);
      filter.Q.setValueAtTime(1.8, now);

      const env = ctx.createGain();
      const amp = 0.38 * (intensity || 1);
      env.gain.setValueAtTime(amp, now);
      env.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

      noise.connect(filter);
      filter.connect(env);
      env.connect(waterGain);
      noise.start(now);

      // Gentle water drop blip
      const drop = ctx.createOscillator();
      const dropEnv = ctx.createGain();
      drop.type = `sine`;
      drop.frequency.setValueAtTime(520 + Math.random() * 180, now + 0.02);
      drop.frequency.exponentialRampToValueAtTime(980, now + 0.09);
      dropEnv.gain.setValueAtTime(0.08 * (intensity || 1), now + 0.02);
      dropEnv.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      drop.connect(dropEnv);
      dropEnv.connect(waterGain);
      drop.start(now + 0.02);
      drop.stop(now + 0.12);
    }

    /* =========================================================================
       7. World Geometry, Sky Palettes, Stars, Orbits, Lake Reflections
       ========================================================================= */
    const canvas = document.getElementById(`cosmos-canvas`);
    const ctx = canvas ? canvas.getContext(`2d`) : null;
    let viewW = window.innerWidth;
    let viewH = window.innerHeight;

    // Sky palette cross-fade state
    const skyState = {
      fromIdx: 0,
      toIdx: 1,
      blend: 0,
      lastSwitchAt: performance.now(),
      holdMs: 22000,
      fadeMs: 8000
    };

    const bgStars = [];
    const grassBlades = [];
    const fireflies = [];

    function initAmbientSceneParticles() {
      bgStars.length = 0;
      for (let i = 0; i < 185; i++) {
        bgStars.push({
          xNorm: Math.random(),
          yNorm: Math.random() * 0.67,
          r: 0.6 + Math.random() * 1.7,
          phase: Math.random() * Math.PI * 2,
          speed: 0.8 + Math.random() * 2.2,
          tint: Math.random() < 0.25 ? `#dfaa5b` : (Math.random() < 0.45 ? `#7cc4e8` : `#f2ece1`)
        });
      }

      grassBlades.length = 0;
      for (let i = 0; i < 170; i++) {
        grassBlades.push({
          xNorm: 0.005 + (i / 170) * 0.545 + (Math.random() - 0.5) * 0.004,
          len: 7 + Math.random() * 14,
          lean: (Math.random() - 0.5) * 6,
          phase: Math.random() * Math.PI * 2
        });
      }

      fireflies.length = 0;
      for (let i = 0; i < 24; i++) {
        fireflies.push({
          xNorm: 0.04 + Math.random() * 0.49,
          yOffset: 10 + Math.random() * 68,
          vx: (Math.random() - 0.5) * 0.00018,
          vy: (Math.random() - 0.5) * 0.14,
          phase: Math.random() * Math.PI * 2,
          r: 1.5 + Math.random() * 1.8
        });
      }
    }

    function getShoreNorm() {
      return 0.545;
    }

    function getWaterLevelY() {
      return viewH * 0.725;
    }

    function getHillSurfaceY(x) {
      const xNorm = x / Math.max(1, viewW);
      const waterY = getWaterLevelY();
      const shoreX = getShoreNorm() * viewW;

      if (x <= shoreX) {
        const t = xNorm / getShoreNorm(); // 0 (left) -> 1 (shore)
        const hillPeak = viewH * 0.155;
        const ridge = Math.cos(t * Math.PI * 0.92) * 0.5 + 0.5;
        const undulation = Math.sin(t * Math.PI * 2.3) * 14;
        return waterY - hillPeak * Math.pow(ridge, 1.15) - undulation * (1 - t);
      }

      // Lake bed gently dips beneath the water, rising slightly at right edge bank
      const lakeT = Math.min(1, (xNorm - getShoreNorm()) / (1 - getShoreNorm()));
      if (lakeT > 0.94) {
        const bankT = (lakeT - 0.94) / 0.06;
        return waterY + 12 * (1 - bankT) - bankT * 10;
      }
      const depth = Math.sin(lakeT * Math.PI) * 26;
      return waterY + depth;
    }

    function getWalkableSurfaceY(x) {
      const shoreX = getShoreNorm() * viewW;
      const waterY = getWaterLevelY();
      if (x <= shoreX) return getHillSurfaceY(x);
      // Character wades gently in shallow lake surface
      const lakeT = Math.min(1, (x / Math.max(1, viewW) - getShoreNorm()) / (1 - getShoreNorm()));
      if (lakeT > 0.94) return getHillSurfaceY(x);
      return waterY + 6 + Math.sin(lakeT * Math.PI) * 8;
    }

    function resizeCanvas() {
      if (!canvas) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      viewW = window.innerWidth;
      viewH = window.innerHeight;
      canvas.width = Math.floor(viewW * dpr);
      canvas.height = Math.floor(viewH * dpr);
      if (ctx) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }

    function lerpRgb(c1, c2, t) {
      const r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
      const g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
      const b = Math.round(c1[2] + (c2[2] - c1[2]) * t);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function getCurrentSkyColors(now) {
      const elapsed = now - skyState.lastSwitchAt;
      if (elapsed > skyState.holdMs + skyState.fadeMs) {
        skyState.fromIdx = skyState.toIdx;
        let nextIdx = Math.floor(Math.random() * SKY_PALETTES.length);
        if (nextIdx === skyState.fromIdx) {
          nextIdx = (skyState.fromIdx + 1) % SKY_PALETTES.length;
        }
        skyState.toIdx = nextIdx;
        skyState.lastSwitchAt = now;
        skyState.blend = 0;
      } else if (elapsed > skyState.holdMs) {
        const rawT = (elapsed - skyState.holdMs) / skyState.fadeMs;
        skyState.blend = rawT * rawT * (3 - 2 * rawT);
      } else {
        skyState.blend = 0;
      }

      const p1 = SKY_PALETTES[skyState.fromIdx];
      const p2 = SKY_PALETTES[skyState.toIdx];
      return {
        top: lerpRgb(p1.top, p2.top, skyState.blend),
        mid: lerpRgb(p1.mid, p2.mid, skyState.blend),
        horizon: lerpRgb(p1.horizon, p2.horizon, skyState.blend)
      };
    }

    /* =========================================================================
       8. Orbits & Shooting Stars Logic
       ========================================================================= */
    const VIOLIN_SCALE = [293.66, 369.99, 440.00, 493.88, 554.37, 659.25, 739.99, 880.00];

    function getTotalActiveOrbits() {
      let total = 0;
      for (let i = 0; i < appState.orbitBatches.length; i++) {
        total += appState.orbitBatches[i].curves.length;
      }
      return total;
    }

    function evalOrbitPoint(curve, t) {
      if (curve.isCircular) {
        const angle = curve.startAngle + t * Math.PI * 2;
        return {
          x: (curve.cx + Math.cos(angle) * curve.rx) * viewW,
          y: (curve.cy + Math.sin(angle) * curve.ry) * viewH
        };
      }
      const mt = 1 - t;
      const x = (mt * mt * curve.x0 + 2 * mt * t * curve.cx + t * t * curve.x1) * viewW;
      const y = (mt * mt * curve.y0 + 2 * mt * t * curve.cy + t * t * curve.y1) * viewH;
      return { x: x, y: y };
    }

    function spawnOrbitsAtSky(clickX, clickY) {
      const currentTotal = getTotalActiveOrbits();
      if (currentTotal >= MAX_ORBITS_PER_ROOM) {
        showToast(`이 행성에는 최대 ${MAX_ORBITS_PER_ROOM}개의 궤도만 그릴 수 있어요.`);
        return;
      }

      const desired = 2 + Math.floor(Math.random() * 3); // 2 to 4 curves
      const count = Math.min(desired, MAX_ORBITS_PER_ROOM - currentTotal);
      const now = performance.now();
      const batchId = `batch_${now}_${Math.random().toString(36).slice(2, 6)}`;
      const curves = [];

      const clickXNorm = Math.max(0.1, Math.min(0.9, clickX / Math.max(1, viewW)));
      const clickYNorm = Math.max(0.1, Math.min(0.54, clickY / Math.max(1, viewH)));

      for (let i = 0; i < count; i++) {
        const isCircular = Math.random() < 0.02; // 2% chance for circular orbit
        const curveId = `curve_${batchId}_${i}`;
        let curve;
        if (isCircular) {
          const rad = 0.09 + Math.random() * 0.09;
          curve = {
            id: curveId,
            isCircular: true,
            cx: Math.max(0.18, Math.min(0.82, clickXNorm + (Math.random() - 0.5) * 0.12)),
            cy: Math.max(0.16, Math.min(0.45, clickYNorm + (Math.random() - 0.5) * 0.08)),
            rx: rad * (viewH / Math.max(1, viewW)) * 1.15,
            ry: rad,
            startAngle: Math.random() * Math.PI * 2,
            createdAt: now,
            delayMs: i * 380,
            star: null
          };
        } else {
          const leftStart = i % 2 === 0;
          const x0 = leftStart ? -0.05 + Math.random() * 0.15 : 0.90 + Math.random() * 0.15;
          const x1 = leftStart ? 0.88 + Math.random() * 0.17 : -0.05 + Math.random() * 0.17;
          const y0 = 0.08 + Math.random() * 0.42;
          const y1 = 0.08 + Math.random() * 0.42;
          const cx = clickXNorm + (Math.random() - 0.5) * 0.24;
          const cy = Math.max(0.03, clickYNorm - 0.12 + (Math.random() - 0.5) * 0.22);
          curve = {
            id: curveId,
            isCircular: false,
            x0: x0,
            y0: y0,
            cx: cx,
            cy: cy,
            x1: x1,
            y1: y1,
            createdAt: now,
            delayMs: i * 380,
            star: null
          };
        }

        const starT = 0.28 + Math.random() * 0.44;
        curve.star = {
          id: `star_${curveId}`,
          curveId: curveId,
          batchId: batchId,
          t: starT,
          speed: (Math.random() < 0.5 ? 1 : -1) * (0.012 + Math.random() * 0.01),
          state: `ready`, // 'ready' | 'written' | 'departed'
          departAt: 0,
          letter: null
        };

        curves.push(curve);

        // Play Violin Harmony Note for each orbit curve
        const noteFreq = VIOLIN_SCALE[(i * 2 + Math.floor(Math.random() * 2)) % VIOLIN_SCALE.length];
        playViolinHarmony(noteFreq, i * 0.42);
      }

      appState.orbitBatches.push({
        id: batchId,
        curves: curves,
        alpha: 1,
        fading: false
      });
    }

    function drawOrbitsAndStars(ctxRef, now, isReflection) {
      const waterY = getWaterLevelY();
      for (let b = appState.orbitBatches.length - 1; b >= 0; b--) {
        const batch = appState.orbitBatches[b];

        // Check if all stars in batch have departed
        let anyNotDeparted = false;
        for (let c = 0; c < batch.curves.length; c++) {
          if (batch.curves[c].star && batch.curves[c].star.state !== `departed`) {
            anyNotDeparted = true;
            break;
          }
        }
        if (!anyNotDeparted && !batch.fading) {
          batch.fading = true;
        }
        if (batch.fading) {
          batch.alpha -= 0.014;
          if (batch.alpha <= 0) {
            appState.orbitBatches.splice(b, 1);
            continue;
          }
        }

        for (let c = 0; c < batch.curves.length; c++) {
          const curve = batch.curves[c];
          const drawElapsed = Math.max(0, now - curve.createdAt - curve.delayMs);
          const drawProgress = Math.min(1, drawElapsed / 3000);
          if (drawProgress <= 0) continue;

          const baseAlpha = batch.alpha * (isReflection ? 0.32 : 0.65);
          ctxRef.save();
          ctxRef.beginPath();
          const steps = 64;
          const maxStep = Math.max(2, Math.floor(steps * drawProgress));
          for (let s = 0; s <= maxStep; s++) {
            const t = (s / steps);
            const pt = evalOrbitPoint(curve, t);
            let drawY = pt.y;
            let drawX = pt.x;
            if (isReflection) {
              drawY = waterY + (waterY - pt.y) * 0.62;
              drawX += Math.sin(now * 0.003 + drawY * 0.08) * 3.5;
            }
            if (s === 0) ctxRef.moveTo(drawX, drawY);
            else ctxRef.lineTo(drawX, drawY);
          }

          ctxRef.strokeStyle = `rgba(223, 170, 91, ${baseAlpha * 0.55})`;
          ctxRef.lineWidth = isReflection ? 1.4 : 1.3;
          ctxRef.setLineDash(curve.isCircular ? [] : [5, 6]);
          ctxRef.stroke();
          ctxRef.setLineDash([]);
          ctxRef.restore();

          // Orbit star logic (update only during main sky pass)
          const star = curve.star;
          if (star && star.state !== `departed`) {
            if (!isReflection && drawProgress >= 1) {
              star.t += star.speed * 0.016;
              if (curve.isCircular) {
                if (star.t > 1) star.t -= 1;
                if (star.t < 0) star.t += 1;
              } else {
                if (star.t > 0.92 || star.t < 0.08) star.speed *= -1;
              }

              // Check 10-second departure trigger
              if (star.state === `written` && now >= star.departAt) {
                star.state = `departed`;
                const sPt = evalOrbitPoint(curve, star.t);
                launchDepartingStar(sPt.x, sPt.y);
              }
            }

            if (drawProgress >= 0.45 && star.state !== `departed`) {
              const sPt = evalOrbitPoint(curve, Math.min(drawProgress, star.t));
              let sx = sPt.x;
              let sy = sPt.y;
              if (isReflection) {
                sy = waterY + (waterY - sy) * 0.62;
                sx += Math.sin(now * 0.003 + sy * 0.08) * 3.5;
              }

              // Countdown ring if written
              if (!isReflection && star.state === `written`) {
                const remain = Math.max(0, (star.departAt - now) / 10000);
                ctxRef.save();
                ctxRef.beginPath();
                ctxRef.arc(sx, sy, 14, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * remain);
                ctxRef.strokeStyle = `rgba(124, 196, 232, 0.85)`;
                ctxRef.lineWidth = 1.6;
                ctxRef.stroke();
                ctxRef.restore();
              }

              const glowR = isReflection ? 12 : 16;
              const grad = ctxRef.createRadialGradient(sx, sy, 1, sx, sy, glowR);
              const coreColor = star.state === `written` ? `rgba(124, 196, 232, ` : `rgba(245, 220, 176, `;
              grad.addColorStop(0, coreColor + (isReflection ? `0.55)` : `0.95)`));
              grad.addColorStop(0.4, coreColor + (isReflection ? `0.25)` : `0.45)`));
              grad.addColorStop(1, coreColor + `0)`);
              ctxRef.fillStyle = grad;
              ctxRef.beginPath();
              ctxRef.arc(sx, sy, glowR, 0, Math.PI * 2);
              ctxRef.fill();

              // 4-point star sparkle
              if (!isReflection) {
                ctxRef.save();
                ctxRef.translate(sx, sy);
                ctxRef.fillStyle = `#fffaf0`;
                ctxRef.beginPath();
                for (let k = 0; k < 4; k++) {
                  const a = (k * Math.PI) / 2;
                  ctxRef.lineTo(Math.cos(a) * 8, Math.sin(a) * 8);
                  ctxRef.lineTo(Math.cos(a + Math.PI / 4) * 2.5, Math.sin(a + Math.PI / 4) * 2.5);
                }
                ctxRef.closePath();
                ctxRef.fill();
                ctxRef.restore();
              }
            }
          }
        }
      }
    }

    function launchDepartingStar(startX, startY) {
      playSparkleChime(660);
      const goRight = startX < viewW * 0.55;
      appState.shootingEffects.push({
        x: startX,
        y: startY,
        vx: (goRight ? 1 : -1) * (360 + Math.random() * 140),
        vy: -(180 + Math.random() * 110),
        trail: [],
        alpha: 1
      });
    }

    /* =========================================================================
       9. Falling Star Mechanics (Every 1 min per room, 50% chance)
       ========================================================================= */
    function buildTornPreviewSegments(text) {
      // Visually tag 1-2 short spans as partially obscured by torn paper edge
      return text;
    }

    function triggerFallingStarRoll(forceSpawn) {
      if (!forceSpawn && Math.random() >= 0.5) {
        return;
      }
      if (appState.fallenStars.length >= 6) {
        appState.fallenStars.shift();
      }

      const landOnLake = Math.random() < 0.45;
      const targetXNorm = landOnLake
        ? 0.60 + Math.random() * 0.28
        : 0.08 + Math.random() * 0.40;

      // 90% nature encouragement sentence; 10% real user letter from global pool (0% AI letters)
      const roll = Math.random();
      let payload;
      if (roll < 0.10 && appState.globalUserLetters.length > 0) {
        const picked = appState.globalUserLetters[Math.floor(Math.random() * appState.globalUserLetters.length)];
        const isTorn = Math.random() < 0.30; // 30% chance for torn cream paper effect
        payload = {
          kind: `user`,
          to: picked.to,
          content: picked.content,
          from: picked.from || ``,
          isTorn: isTorn,
          planetOrigin: picked.planet || 1
        };
      } else {
        const sent = NATURE_SENTENCES[Math.floor(Math.random() * NATURE_SENTENCES.length)];
        payload = {
          kind: `nature`,
          to: sent.to,
          content: sent.content,
          from: `자연의 품에서`,
          isTorn: false
        };
      }

      const startXNorm = Math.max(0.05, Math.min(0.95, targetXNorm + (Math.random() < 0.5 ? -0.18 : 0.18)));
      appState.fallingTrails.push({
        xNorm: startXNorm,
        y: -20,
        targetXNorm: targetXNorm,
        landOnLake: landOnLake,
        progress: 0,
        payload: payload
      });
    }

    // 1-minute per planet room falling star check
    setInterval(function () {
      triggerFallingStarRoll(false);
    }, 60000);

    /* =========================================================================
       10. Letter Writing, Reading, Archiving & Releasing
       ========================================================================= */
    function openWriteModalForStar(star) {
      appState.activeOrbitStarRef = star;
      const toEl = document.getElementById(`write-to`);
      const contentEl = document.getElementById(`write-content`);
      const fromEl = document.getElementById(`write-from`);
      const errEl = document.getElementById(`write-error-msg`);
      if (toEl) toEl.value = ``;
      if (contentEl) contentEl.value = ``;
      if (fromEl) fromEl.value = ``;
      if (errEl) errEl.textContent = ``;
      const modal = document.getElementById(`modal-write`);
      if (modal) modal.classList.add(`open`);
      if (toEl) toEl.focus();
    }

    function closeWriteModal() {
      const modal = document.getElementById(`modal-write`);
      if (modal) modal.classList.remove(`open`);
      appState.activeOrbitStarRef = null;
    }

    function submitStarLetter(mode) {
      const toEl = document.getElementById(`write-to`);
      const contentEl = document.getElementById(`write-content`);
      const fromEl = document.getElementById(`write-from`);
      const errEl = document.getElementById(`write-error-msg`);
      if (!toEl || !contentEl || !fromEl || !errEl) return;

      const toVal = toEl.value.trim();
      const contentVal = contentEl.value.trim();
      const fromVal = fromEl.value.trim();

      if (!toVal) {
        errEl.textContent = `받는 이(To)를 입력해주세요.`;
        toEl.focus();
        return;
      }
      if (!contentVal) {
        errEl.textContent = `편지 내용(Content)을 입력해주세요.`;
        contentEl.focus();
        return;
      }

      const letterObj = {
        id: `ltr_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        to: toVal,
        content: contentVal,
        from: fromVal,
        planet: appState.currentPlanet,
        createdAt: new Date().toISOString()
      };

      if (mode === `send`) {
        appState.globalUserLetters.push(letterObj);
        broadcastEvent({ type: `global_letter`, letter: letterObj });
        showToast(`편지가 우주로 전송되었습니다. 10초 뒤 별이 긴 꼬리를 남기며 떠납니다.`);
      } else {
        appState.archiveLetters.push(Object.assign({ kind: `user`, isTorn: false }, letterObj));
        updateHudBadges();
        showToast(`별자리 보관함에 간직했습니다. 10초 뒤 별이 밤하늘로 떠납니다.`);
      }

      if (appState.activeOrbitStarRef) {
        appState.activeOrbitStarRef.state = `written`;
        appState.activeOrbitStarRef.departAt = performance.now() + 10000;
        appState.activeOrbitStarRef.letter = letterObj;
      }

      savePersistedState();
      closeWriteModal();
    }

    function openReadingModal(item) {
      appState.activeReadingItem = item;
      const data = item.payload || item;
      const paperBox = document.getElementById(`read-paper-box`);
      const scrapTop = document.getElementById(`tear-scrap-top`);
      const scrapBot = document.getElementById(`tear-scrap-bottom`);
      const tagEl = document.getElementById(`read-source-tag`);
      const toLine = document.getElementById(`read-to-line`);
      const bodyText = document.getElementById(`read-body-text`);
      const fromLine = document.getElementById(`read-from-line`);
      const keepBtn = document.getElementById(`btn-read-keep`);

      if (!paperBox || !tagEl || !toLine || !bodyText || !fromLine) return;

      const isTorn = Boolean(data.isTorn);
      if (isTorn) {
        paperBox.classList.add(`torn-cream`);
        if (scrapTop) scrapTop.style.display = `block`;
        if (scrapBot) scrapBot.style.display = `block`;
      } else {
        paperBox.classList.remove(`torn-cream`);
        if (scrapTop) scrapTop.style.display = `none`;
        if (scrapBot) scrapBot.style.display = `none`;
      }

      tagEl.textContent = item.isArchived
        ? `별자리 보관함의 별`
        : (data.kind === `user`
          ? (isTorn ? `어느 행성에서 날아온 낡은 편지` : `어느 행성에서 건너온 편지`)
          : (item.isBoat ? `호수 위의 종이배` : `자연이 건네는 문장`));

      toLine.textContent = `To. ${data.to || `당신에게`}`;

      // Render torn partial concealment safely without innerHTML XSS
      bodyText.textContent = ``;
      const rawText = data.content || ``;
      if (isTorn && rawText.length > 12) {
        const cutStart = Math.floor(rawText.length * 0.38);
        const cutLen = Math.min(4, Math.max(2, Math.floor(rawText.length * 0.08)));
        const before = rawText.slice(0, cutStart);
        const hidden = rawText.slice(cutStart, cutStart + cutLen);
        const after = rawText.slice(cutStart + cutLen);

        bodyText.appendChild(document.createTextNode(before));
        const maskSpan = document.createElement(`span`);
        maskSpan.className = `torn-concealed`;
        maskSpan.textContent = hidden;
        maskSpan.setAttribute(`aria-label`, `찢어진 종이 조각으로 가려진 글자`);
        bodyText.appendChild(maskSpan);
        bodyText.appendChild(document.createTextNode(after));
      } else {
        bodyText.textContent = rawText;
      }

      fromLine.textContent = data.from ? `From. ${data.from}` : ``;

      if (keepBtn) {
        if (item.isArchived) keepBtn.textContent = `계속 간직하기`;
        else if (item.isBoat) keepBtn.textContent = `호수에 띄워두기`;
        else keepBtn.textContent = `보관하기`;
      }

      const modal = document.getElementById(`modal-read`);
      if (modal) modal.classList.add(`open`);
    }

    function closeReadModal() {
      const modal = document.getElementById(`modal-read`);
      if (modal) modal.classList.remove(`open`);
      appState.activeReadingItem = null;
    }

    function keepCurrentReading() {
      const item = appState.activeReadingItem;
      if (!item) return;

      if (item.isArchived) {
        closeReadModal();
        showToast(`별자리 보관함에 소중히 간직되어 있습니다.`);
        return;
      }

      if (item.isBoat) {
        closeReadModal();
        showToast(`종이배가 호수 위에서 고요히 항해합니다.`);
        return;
      }

      const data = item.payload;
      if (data.kind === `nature`) {
        // Nature sentences turn into floating paper boats on the lake
        appState.paperBoats.push({
          id: `boat_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          xNorm: 0.59 + Math.random() * 0.28,
          phase: Math.random() * Math.PI * 2,
          driftDir: Math.random() < 0.5 ? 1 : -1,
          payload: data
        });
        showToast(`자연의 문장이 호수 위 종이배가 되어 떠올랐습니다.`);
      } else {
        // Real user letters become stars in the Constellation Archive
        appState.archiveLetters.push({
          id: `arch_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          kind: `user`,
          to: data.to,
          content: data.content,
          from: data.from,
          isTorn: Boolean(data.isTorn),
          createdAt: new Date().toISOString()
        });
        showToast(`편지가 별자리 보관함의 새로운 별이 되었습니다.`);
      }

      // Remove fallen star from ground/lake
      const idx = appState.fallenStars.indexOf(item);
      if (idx !== -1) appState.fallenStars.splice(idx, 1);

      updateHudBadges();
      savePersistedState();
      closeReadModal();
    }

    function releaseCurrentReading() {
      const item = appState.activeReadingItem;
      if (!item) return;

      playXylophoneChime();

      const px = item.xNorm * viewW;
      const py = item.isBoat ? getWaterLevelY() + 4 : getWalkableSurfaceY(px) - 8;
      for (let i = 0; i < 24; i++) {
        appState.releaseParticles.push({
          x: px + (Math.random() - 0.5) * 14,
          y: py + (Math.random() - 0.5) * 10,
          vx: (Math.random() - 0.5) * 45,
          vy: -30 - Math.random() * 65,
          r: 1.5 + Math.random() * 2.5,
          alpha: 1
        });
      }

      if (item.isArchived) {
        const aIdx = appState.archiveLetters.findIndex(function (l) { return l.id === item.id; });
        if (aIdx !== -1) appState.archiveLetters.splice(aIdx, 1);
      } else if (item.isBoat) {
        const bIdx = appState.paperBoats.indexOf(item);
        if (bIdx !== -1) appState.paperBoats.splice(bIdx, 1);
      } else {
        const sIdx = appState.fallenStars.indexOf(item);
        if (sIdx !== -1) appState.fallenStars.splice(sIdx, 1);
      }

      updateHudBadges();

    /* =========================================================================
       11. Constellation Archive Modal
       ========================================================================= */
    function openArchiveModal() {
      const modal = document.getElementById(`modal-archive`);

    }

    function closeArchiveModal() {
      const modal = document.getElementById(`modal-archive`);

    function renderArchiveModal() {
      const listWrap = document.getElementById(`archive-list-wrap`);
      const constCanvas = document.getElementById(`constellation-canvas`);
      if (!listWrap || !constCanvas) return;

      listWrap.textContent = ``;
      const letters = appState.archiveLetters;

      if (letters.length === 0) {
        const empty = document.createElement(`div`);
        empty.className = `empty-state`;
        empty.style.gridColumn = `1 / -1`;
        empty.textContent = `아직 별자리 보관함에 담긴 편지가 없습니다. 밤하늘의 궤도 별이나 땅에 떨어진 편지를 보관해보세요.`;
        listWrap.appendChild(empty);
      } else {
        for (let i = 0; i < letters.length; i++) {
          const ltr = letters[i];
          const card = document.createElement(`button`);
          card.type = `button`;
          card.className = `archive-item` + (appState.selectedArchiveId === ltr.id ? ` selected` : ``);
          card.onclick = function () {
            appState.selectedArchiveId = ltr.id;
            closeArchiveModal();
            openReadingModal({ id: ltr.id, payload: ltr, isArchived: true });
          };

          const title = document.createElement(`div`);
          title.className = `archive-item-title`;
          title.textContent = `To. ${ltr.to}`;

          const snip = document.createElement(`div`);
          snip.className = `archive-item-snippet`;
          snip.textContent = ltr.content;

          const meta = document.createElement(`div`);
          meta.className = `mono-meta`;
          meta.textContent = ltr.from ? `From. ${ltr.from}` : `익명의 별빛`;

          card.appendChild(title);
          card.appendChild(snip);
          card.appendChild(meta);
          listWrap.appendChild(card);
        }
      }

      // Render Constellation Canvas
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const cw = constCanvas.offsetWidth || 640;
      const ch = constCanvas.offsetHeight || 240;
      constCanvas.width = Math.floor(cw * dpr);
      constCanvas.height = Math.floor(ch * dpr);
      const cCtx = constCanvas.getContext(`2d`);
      if (!cCtx) return;
      cCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      cCtx.fillStyle = `#0a101d`;
      cCtx.fillRect(0, 0, cw, ch);

      // Subtle background stars
      for (let i = 0; i < 45; i++) {
        const bx = ((i * 97) % 100) / 100 * cw;
        const by = ((i * 53) % 100) / 100 * ch;
        cCtx.fillStyle = `rgba(242, 236, 225, 0.25)`;
        cCtx.beginPath();
        cCtx.arc(bx, by, 1, 0, Math.PI * 2);
        cCtx.fill();
      }

      const nodes = [];
      for (let i = 0; i < letters.length; i++) {
        const x = 44 + ((i * 137 + 41) % Math.max(80, cw - 88));
        const y = 38 + ((i * 79 + 29) % Math.max(60, ch - 76));
        nodes.push({ x: x, y: y, ltr: letters[i] });
      }

      // Connect constellation lines
      if (nodes.length > 1) {
        cCtx.strokeStyle = `rgba(124, 196, 232, 0.45)`;
        cCtx.lineWidth = 1.2;
        cCtx.beginPath();
        cCtx.moveTo(nodes[0].x, nodes[0].y);
        for (let i = 1; i < nodes.length; i++) {
          cCtx.lineTo(nodes[i].x, nodes[i].y);
        }
        cCtx.stroke();
      }

      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        const grad = cCtx.createRadialGradient(n.x, n.y, 1, n.x, n.y, 12);
        grad.addColorStop(0, `rgba(223, 170, 91, 0.95)`);
        grad.addColorStop(1, `rgba(223, 170, 91, 0)`);
        cCtx.fillStyle = grad;
        cCtx.beginPath();
        cCtx.arc(n.x, n.y, 12, 0, Math.PI * 2);
        cCtx.fill();

        cCtx.fillStyle = `#f2ece1`;
        cCtx.beginPath();
        cCtx.arc(n.x, n.y, 3, 0, Math.PI * 2);
        cCtx.fill();
      }

      constCanvas.onclick = function (ev) {
        const rect = constCanvas.getBoundingClientRect();
        const mx = ev.clientX - rect.left;
        const my = ev.clientY - rect.top;
        for (let i = 0; i < nodes.length; i++) {
          if (Math.hypot(mx - nodes[i].x, my - nodes[i].y) <= 18) {
            appState.selectedArchiveId = nodes[i].ltr.id;
            closeArchiveModal();
            openReadingModal({ id: nodes[i].ltr.id, payload: nodes[i].ltr, isArchived: true });
            return;
          }
        }
      };
    }
